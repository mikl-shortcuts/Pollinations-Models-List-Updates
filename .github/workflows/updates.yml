              for i, p in enumerate(parts):
                  Path(f"/tmp/msg_pi_{i}.txt").write_text(f"{header}\n{p}", encoding="utf-8")
              Path("/tmp/pi_count.txt").write_text(str(len(parts)), encoding="utf-8")

              embeds = []
              if added:
                  desc = [f"- {to_monospace(n)} {curr_map[n].get('description','')}" for n in added]
                  embeds.append({"title": "Added Models:", "description": "\n".join(desc), "color": 0x86B953})
              if modified:
                  desc = []
                  for n in sorted(modified):
                      desc.append(f"- {to_monospace(n)}:")
                      for k,ch in modified[n].items(): desc.append(f"   - {k}: {ch['old']} -> {ch['new']}")
                  embeds.append({"title": "Updated Models:", "description": "\n".join(desc), "color": 0xF5C944})
              if removed:
                  desc = [f"- {to_monospace(n)} {prev_map[n].get('description','')}" for n in removed]
                  embeds.append({"title": "Deleted Models:", "description": "\n".join(desc), "color": 0xEB512E})

              discord_payload = {
                  "content": "## 🖼️ Pollinations AI Image Models Update:",
                  "username": "Pollinations Models List Updates Bot",
                  "avatar_url": "https://raw.githubusercontent.com/MIKL08/pollinations-updates-notifications/refs/heads/master/Photoroom_20250827_191533.jpeg",
                  "embeds": embeds
              }
              Path("/tmp/discord_pi.json").write_text(json.dumps(discord_payload), encoding="utf-8")
          PY

      - name: Send Notifications
        run: |
          if [ "$(cat /tmp/changed_lt.flag 2>/dev/null)" = "true" ]; then
             MSG=$(cat /tmp/msg_lt.txt)
             curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
               -d chat_id="${{ env.TG_CHAT }}" \
               -d text="$MSG" -d parse_mode="HTML" -d disable_web_page_preview=true
             curl -H "Content-Type: application/json" -d @/tmp/discord_lt.json "${{ env.DS_LEGACY }}"
          fi

          if [ "$(cat /tmp/changed_li.flag 2>/dev/null)" = "true" ]; then
             MSG=$(cat /tmp/msg_li.txt)
             curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
               -d chat_id="${{ env.TG_CHAT }}" \
               -d text="$MSG" -d parse_mode="HTML" -d disable_web_page_preview=true
             curl -H "Content-Type: application/json" -d @/tmp/discord_li.json "${{ env.DS_LEGACY }}"
          fi

          if [ "$(cat /tmp/changed_pt.flag 2>/dev/null)" = "true" ]; then
             PARTS=$(cat /tmp/pt_count.txt)
             for i in $(seq 0 $((PARTS - 1))); do
               MSG=$(cat /tmp/msg_pt_${i}.txt)
               curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
                 -H "Content-Type: application/json" \
                 -d "$(jq -n --arg chat "${{ env.TG_CHAT }}" --arg text "$MSG" '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
               sleep 1
             done
             curl -H "Content-Type: application/json" -d @/tmp/discord_pt.json "${{ env.DS_POLLENS }}"
          fi

          if [ "$(cat /tmp/changed_pi.flag 2>/dev/null)" = "true" ]; then
             PARTS=$(cat /tmp/pi_count.txt)
             for i in $(seq 0 $((PARTS - 1))); do
               MSG=$(cat /tmp/msg_pi_${i}.txt)
               curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
                 -H "Content-Type: application/json" \
                 -d "$(jq -n --arg chat "${{ env.TG_CHAT }}" --arg text "$MSG" '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
               sleep 1
             done
             curl -H "Content-Type: application/json" -d @/tmp/discord_pi.json "${{ env.DS_POLLENS }}"
          fi

      - name: Commit and Push
        run: |
          if git diff --quiet pollinations_text_models.json pollinations_image_models.json pollens_text_models.json pollens_image_models.json; then
             exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pollinations_text_models.json pollinations_image_models.json pollens_text_models.json pollens_image_models.json
          git commit -m "Update models snapshot [$(date +'%Y-%m-%d %H:%M')]"
          git push origin saves