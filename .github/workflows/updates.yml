name: Pollinations Models Monitor

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-monitor]

permissions:
  contents: write

env:
  TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TG_NOTIFY: ${{ secrets.TELEGRAM_CHANNEL }}
  TG_ERROR: ${{ secrets.TELEGRAM_ERRORS }}
  DS_WEBHOOK: ${{ secrets.DS_WEBHOOK }}
  DS_WEBHOOK_TEXT: ${{ secrets.DS_WEBHOOK_TEXT }}
  DS_WEBHOOK_IMAGE: ${{ secrets.DS_WEBHOOK_IMAGE }}
  DS_WEBHOOK_VIDEO: ${{ secrets.DS_WEBHOOK_VIDEO }}
  DS_WEBHOOK_AUDIO: ${{ secrets.DS_WEBHOOK_AUDIO }}
  DS_WEBHOOK_3D: ${{ secrets.DS_WEBHOOK_3D }}
  DS_WEBHOOK_EMBEDDINGS: ${{ secrets.DS_WEBHOOK_EMBEDDINGS }}
  DS_WEBHOOK_COMMUNITY: ${{ secrets.DS_WEBHOOK_COMMUNITY }}

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout saves branch
        uses: actions/checkout@v4
        with:
          ref: saves
          sparse-checkout: |
            text_models.json
            image_models.json
            video_models.json
            audio_models.json
            3d_models.json
            embeddings_models.json
          sparse-checkout-cone-mode: false
        continue-on-error: true

      - name: Prepare Checker Script
        run: |
          cat << 'EOF' > /tmp/check.py
          import json, sys, urllib.request, time, os
          from pathlib import Path

          cat_id = sys.argv[1]
          url = sys.argv[2]
          dest_path = sys.argv[3]
          emoji = sys.argv[4]
          title = sys.argv[5]
          filter_cat = sys.argv[6] if len(sys.argv) > 6 else None

          MAX_LEN = 3500

          data = None
          for _ in range(3):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'github-actions-bot'})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = json.loads(response.read().decode('utf-8'))
                      break
              except Exception:
                  time.sleep(5)

          if data is None:
              tg_token = os.environ.get("TG_TOKEN")
              tg_error = os.environ.get("TG_ERROR")
              if tg_token and tg_error:
                  err_msg = f"‼️<i>Maybe</i> <b>Pollinations AI {title} API is down</b>‼️"
                  err_url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  payload = json.dumps({"chat_id": tg_error, "text": err_msg, "parse_mode": "HTML"}).encode('utf-8')
                  try:
                      err_req = urllib.request.Request(err_url, data=payload, headers={'Content-Type': 'application/json'})
                      urllib.request.urlopen(err_req)
                  except Exception: pass
              sys.exit(0)

          models = data.get("data", []) if isinstance(data, dict) else data
          if not isinstance(models, list):
              sys.exit(0)

          if filter_cat:
              models = [m for m in models if isinstance(m, dict) and m.get("category") == filter_cat]

          normalized = [dict(m) for m in models if isinstance(m, dict)]
          normalized.sort(key=lambda x: str(x.get("name", "")))
          curr_txt = json.dumps(normalized, ensure_ascii=False, indent=2, sort_keys=True) + "\n"

          prev_path = Path(dest_path)
          if not prev_path.exists():
              prev_path.write_text(curr_txt, encoding="utf-8")
              Path(f"/tmp/changed_{cat_id}.flag").write_text("false", encoding="utf-8")
              sys.exit(0)

          prev = json.loads(prev_path.read_text(encoding="utf-8"))
          prev_map = {str(i.get("name", "")): i for i in prev if i.get("name")}
          curr_map = {str(i.get("name", "")): i for i in normalized if i.get("name")}

          added = sorted(set(curr_map) - set(prev_map))
          removed = sorted(set(prev_map) - set(curr_map))
          common = sorted(set(prev_map) & set(curr_map))
          modified = {}

          def diff_dicts(o, n, prefix=""):
              d = {}
              for k in sorted(set(o.keys()) | set(n.keys())):
                  if k == "created": continue
                  full_key = f"{prefix}.{k}" if prefix else k
                  ov, nv = o.get(k), n.get(k)
                  if ov != nv:
                      if isinstance(ov, dict) and isinstance(nv, dict):
                          d.update(diff_dicts(ov, nv, full_key))
                      else:
                          d[full_key] = {"old": ov, "new": nv}
              return d

          for name in common:
              d = diff_dicts(prev_map[name], curr_map[name])
              old_p = prev_map[name].get("pricing")
              new_p = curr_map[name].get("pricing")
              if isinstance(old_p, dict) and isinstance(new_p, dict):
                  old_cur = old_p.get("currency", "pollen")
                  new_cur = new_p.get("currency", "pollen")
                  if old_cur != new_cur:
                      for pk in set(old_p.keys()) | set(new_p.keys()):
                          if pk == "currency":
                              continue
                          full_pk = f"pricing.{pk}"
                          d[full_pk] = {
                              "old": old_p.get(pk),
                              "new": new_p.get(pk)
                          }
              if d: modified[name] = d

          has_changes = bool(added or removed or modified)
          Path(f"/tmp/changed_{cat_id}.flag").write_text("true" if has_changes else "false", encoding="utf-8")

          def to_monospace(s):
              mono_map = {'a': '𝚊', 'b': '𝚋', 'c': '𝚌', 'd': '𝚍', 'e': '𝚎', 'f': '𝚏', 'g': '𝚐', 'h': '𝚑', 'i': '𝚒', 'j': '𝚓', 'k': '𝚔', 'l': '𝚕', 'm': '𝚖', 'n': '𝚗', 'o': '𝚘', 'p': '𝚙', 'q': '𝚚', 'r': '𝚛', 's': '𝚜', 't': '𝚝', 'u': '𝚞', 'v': '𝚟', 'w': '𝚠', 'x': '𝚡', 'y': '𝚢', 'z': '𝚣', '0': '𝟶', '1': '𝟷', '2': '𝟸', '3': '𝟹', '4': '𝟺', '5': '𝟻', '6': '𝟼', '7': '𝟽', '8': '𝟾', '9': '𝟿'}
              return "".join(mono_map.get(c, c) for c in s)

          def get_model_desc(m):
              t = (m.get("title") or "").strip()
              d = (m.get("description") or "").strip()
              if t and d:
                  if d.lower().startswith(t.lower()):
                      return d
                  return f"{t} - {d}"
              return t or d or "?"

          def get_tags(m):
              tags = []
              if m.get("alpha"):
                  tags.append("[ALPHA]")
              if m.get("paid_only"):
                  tags.append("[PAID]")
              if m.get("community"):
                  tags.append("[COMMUNITY]")
              return " " + " ".join(tags) if tags else ""

          def format_val(val):
              return "None" if val in ([], "", None) else str(val)

          def format_pricing_value(val, currency="pollen"):
              if val in ([], "", None):
                  return "None"
              try:
                  if cat_id == "text":
                      scaled = float(val) * 1000000
                      s_str = f"{scaled:.10f}".rstrip('0').rstrip('.')
                      if not s_str or s_str == "-0":
                          s_str = "0"
                      return f"{s_str} {currency}/M"
                  else:
                      f_val = float(val)
                      s_str = f"{f_val:.10f}".rstrip('0').rstrip('.')
                      if not s_str or s_str == "-0":
                          s_str = "0"
                      return f"{s_str} {currency}"
              except (ValueError, TypeError):
                  return str(val)

          if has_changes:
              prev_path.write_text(curr_txt, encoding="utf-8")
              blocks = []
              
              for n in added:
                  m = curr_map[n]
                  lines = [f"  - <code>{n}</code>{get_tags(m)} ({get_model_desc(m)})"]
                  for k in sorted(m.keys()):
                      if k in ("category", "community", "added_date", "is_specialized", "alpha", "name", "description", "created", "title", "paid_only"):
                          continue
                      if k == "pricing" and isinstance(m[k], dict):
                          currency = m[k].get("currency", "pollen")
                          for pk in sorted(m[k].keys()):
                              if pk == "currency":
                                  continue
                              lines.append(f"      • pricing.{pk}: {format_pricing_value(m[k][pk], currency)}")
                      else:
                          lines.append(f"      • {k}: {format_val(m[k])}")
                  blocks.append(("added", "\n".join(lines)))
                  
              for n in sorted(modified):
                  m = curr_map[n]
                  prev_m = prev_map[n]
                  mlines = [f"  - <code>{n}</code>{get_tags(m)} ({get_model_desc(m)}):"]
                  for k, ch in sorted(modified[n].items()):
                      if k == "pricing.currency":
                          continue
                      if k.startswith("pricing."):
                          old_p = prev_m.get("pricing", {}) if isinstance(prev_m.get("pricing"), dict) else {}
                          new_p = m.get("pricing", {}) if isinstance(m.get("pricing"), dict) else {}
                          old_cur = old_p.get("currency", "pollen")
                          new_cur = new_p.get("currency", "pollen")
                          f_old = format_pricing_value(ch['old'], old_cur)
                          f_new = format_pricing_value(ch['new'], new_cur)
                          mlines.append(f"      • {k}: {f_old} → {f_new}")
                      else:
                          mlines.append(f"      • {k}: {format_val(ch['old'])} → {format_val(ch['new'])}")
                  blocks.append(("modified", "\n".join(mlines)))
                  
              for n in removed:
                  m = prev_map[n]
                  lines = [f"  - <code>{n}</code>{get_tags(m)} ({get_model_desc(m)})"]
                  for k in sorted(m.keys()):
                      if k in ("category", "community", "added_date", "is_specialized", "alpha", "name", "description", "created", "title", "paid_only"):
                          continue
                      if k == "pricing" and isinstance(m[k], dict):
                          currency = m[k].get("currency", "pollen")
                          for pk in sorted(m[k].keys()):
                              if pk == "currency":
                                  continue
                              lines.append(f"      • pricing.{pk}: {format_pricing_value(m[k][pk], currency)}")
                      else:
                          lines.append(f"      • {k}: {format_val(m[k])}")
                  blocks.append(("removed", "\n".join(lines)))

              header = f"<b>{emoji} Pollinations AI {title} Models Update:</b>"
              sec_h = {"added": "\n<b>+ Added models:</b>", "removed": "\n<b>- Deleted models:</b>", "modified": "\n<b>&gt; Updated models:</b>"}
              parts = []
              cur_lines = []
              cur_sec = None
              cur_len = 0
              for sec, blk in blocks:
                  to_add = ([sec_h[sec]] if sec != cur_sec else []) + [blk]
                  add_len = len("\n".join(to_add)) + 1
                  if cur_len + add_len > MAX_LEN and cur_lines:
                      parts.append("\n".join(cur_lines))
                      cur_lines = [sec_h[sec], blk]
                      cur_len = len("\n".join(cur_lines)) + 1
                      cur_sec = sec
                  else:
                      cur_lines.extend(to_add)
                      cur_len += add_len
                      cur_sec = sec
              if cur_lines: parts.append("\n".join(cur_lines))

              for i, p in enumerate(parts):
                  Path(f"/tmp/msg_{cat_id}_{i}.txt").write_text(f"{header}\n{p}", encoding="utf-8")
              Path(f"/tmp/{cat_id}_count.txt").write_text(str(len(parts)), encoding="utf-8")

              added_std = [n for n in added if not curr_map[n].get("community")]
              added_comm = [n for n in added if curr_map[n].get("community")]
              
              modified_std = [n for n in modified if not curr_map[n].get("community")]
              modified_comm = [n for n in modified if curr_map[n].get("community")]
              
              removed_std = [n for n in removed if not prev_map[n].get("community")]
              removed_comm = [n for n in removed if prev_map[n].get("community")]

              def make_discord_embeds(added_list, modified_list, removed_list, is_comm_channel=False):
                  embeds = []
                  
                  def clean_tags(item):
                      tags = []
                      if item.get("alpha"):
                          tags.append("[ALPHA]")
                      if item.get("paid_only"):
                          tags.append("[PAID]")
                      if not is_comm_channel and item.get("community"):
                          tags.append("[COMMUNITY]")
                      return " " + " ".join(tags) if tags else ""

                  if added_list:
                      desc = []
                      for n in added_list:
                          m = curr_map[n]
                          desc.append(f"- {to_monospace(n)}{clean_tags(m)} ({get_model_desc(m)})")
                          for k in sorted(m.keys()):
                              if k in ("category", "community", "added_date", "is_specialized", "alpha", "name", "description", "created", "title", "paid_only"):
                                  continue
                              if k == "pricing" and isinstance(m[k], dict):
                                  currency = m[k].get("currency", "pollen")
                                  for pk in sorted(m[k].keys()):
                                      if pk == "currency":
                                          continue
                                      desc.append(f"   - pricing.{pk}: {format_pricing_value(m[k][pk], currency)}")
                              else:
                                  desc.append(f"   - {k}: {format_val(m[k])}")
                      embeds.append({"title": "Added Models:", "description": "\n".join(desc), "color": 0x86B953})

                  if modified_list:
                      desc = []
                      for n in sorted(modified_list):
                          m = curr_map[n]
                          prev_m = prev_map[n]
                          desc.append(f"- {to_monospace(n)}{clean_tags(m)} ({get_model_desc(m)}):")
                          for k, ch in sorted(modified[n].items()):
                              if k == "pricing.currency":
                                  continue
                              if k.startswith("pricing."):
                                  old_p = prev_m.get("pricing", {}) if isinstance(prev_m.get("pricing"), dict) else {}
                                  new_p = m.get("pricing", {}) if isinstance(m.get("pricing"), dict) else {}
                                  old_cur = old_p.get("currency", "pollen")
                                  new_cur = new_p.get("currency", "pollen")
                                  f_old = format_pricing_value(ch['old'], old_cur)
                                  f_new = format_pricing_value(ch['new'], new_cur)
                                  desc.append(f"   - {k}: {f_old} -> {f_new}")
                              else:
                                  desc.append(f"   - {k}: {format_val(ch['old'])} -> {format_val(ch['new'])}")
                      embeds.append({"title": "Updated Models:", "description": "\n".join(desc), "color": 0xF5C944})

                  if removed_list:
                      desc = []
                      for n in removed_list:
                          m = prev_map[n]
                          desc.append(f"- {to_monospace(n)}{clean_tags(m)} ({get_model_desc(m)})")
                          for k in sorted(m.keys()):
                              if k in ("category", "community", "added_date", "is_specialized", "alpha", "name", "description", "created", "title", "paid_only"):
                                  continue
                              if k == "pricing" and isinstance(m[k], dict):
                                  currency = m[k].get("currency", "pollen")
                                  for pk in sorted(m[k].keys()):
                                      if pk == "currency":
                                          continue
                                      desc.append(f"   - pricing.{pk}: {format_pricing_value(m[k][pk], currency)}")
                              else:
                                  desc.append(f"   - {k}: {format_val(m[k])}")
                      embeds.append({"title": "Deleted Models:", "description": "\n".join(desc), "color": 0xEB512E})

                  return embeds

              embeds_old = make_discord_embeds(added, modified, removed, is_comm_channel=False)
              if embeds_old:
                  discord_payload = {
                      "content": f"## {emoji} Pollinations AI {title} Models Update:",
                      "username": "Pollinations Models List Updates Bot",
                      "avatar_url": "https://raw.githubusercontent.com/mikl-shortcuts/Pollinations-Models-List-Updates/refs/heads/main/Logo.JPG",
                      "embeds": embeds_old,
                      "flags": 4096
                  }
                  Path(f"/tmp/discord_{cat_id}_old.json").write_text(json.dumps(discord_payload), encoding="utf-8")

              embeds_std = make_discord_embeds(added_std, modified_std, removed_std, is_comm_channel=False)
              if embeds_std:
                  discord_payload = {
                      "content": f"## {emoji} Pollinations AI {title} Models Update:",
                      "username": "Pollinations Models List Updates Bot",
                      "avatar_url": "https://raw.githubusercontent.com/mikl-shortcuts/Pollinations-Models-List-Updates/refs/heads/main/Logo.JPG",
                      "embeds": embeds_std
                  }
                  Path(f"/tmp/discord_{cat_id}_std.json").write_text(json.dumps(discord_payload), encoding="utf-8")

              embeds_comm = make_discord_embeds(added_comm, modified_comm, removed_comm, is_comm_channel=True)
              if embeds_comm:
                  discord_payload = {
                      "content": f"## {emoji} Pollinations AI {title} (Community) Models Update:",
                      "username": "Pollinations Models List Updates Bot",
                      "avatar_url": "https://raw.githubusercontent.com/mikl-shortcuts/Pollinations-Models-List-Updates/refs/heads/main/Logo.JPG",
                      "embeds": embeds_comm
                  }
                  Path(f"/tmp/discord_{cat_id}_comm.json").write_text(json.dumps(discord_payload), encoding="utf-8")
          EOF

      - name: Check Text Models
        run: python3 /tmp/check.py text "https://gen.pollinations.ai/text/models" text_models.json "💬" "Text"

      - name: Check Image Models
        run: python3 /tmp/check.py image "https://gen.pollinations.ai/image/models" image_models.json "🖼️" "Image" "image"

      - name: Check Video Models
        run: python3 /tmp/check.py video "https://gen.pollinations.ai/image/models" video_models.json "🎥" "Video" "video"

      - name: Check Audio Models
        run: python3 /tmp/check.py audio "https://gen.pollinations.ai/audio/models" audio_models.json "🎵" "Audio"

      - name: Check 3D Models
        run: python3 /tmp/check.py 3d "https://gen.pollinations.ai/3d/models" 3d_models.json "💠" "3D"

      - name: Check Embeddings Models
        run: python3 /tmp/check.py embeddings "https://gen.pollinations.ai/embeddings/models" embeddings_models.json "🧪" "Embeddings"

      - name: Send Notifications
        run: |
          CATEGORIES=("text" "image" "video" "audio" "3d" "embeddings")

          for CAT in "${CATEGORIES[@]}"; do
            if [ "$(cat /tmp/changed_${CAT}.flag 2>/dev/null)" = "true" ]; then
              PARTS=$(cat /tmp/${CAT}_count.txt 2>/dev/null || echo 0)
              if [ "$PARTS" -gt 0 ]; then
                for i in $(seq 0 $((PARTS - 1))); do
                  MSG=$(cat /tmp/msg_${CAT}_${i}.txt)
                  curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
                    -H "Content-Type: application/json" \
                    -d "$(jq -n --arg chat "${{ env.TG_NOTIFY }}" --arg text "$MSG" '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
                  sleep 1
                done
              fi

              if [ -f /tmp/discord_${CAT}_old.json ] && [ -n "${{ env.DS_WEBHOOK }}" ]; then
                curl -H "Content-Type: application/json" -d @/tmp/discord_${CAT}_old.json "${{ env.DS_WEBHOOK }}"
              fi

              case "$CAT" in
                text) WEBHOOK_URL="${{ env.DS_WEBHOOK_TEXT }}" ;;
                image) WEBHOOK_URL="${{ env.DS_WEBHOOK_IMAGE }}" ;;
                video) WEBHOOK_URL="${{ env.DS_WEBHOOK_VIDEO }}" ;;
                audio) WEBHOOK_URL="${{ env.DS_WEBHOOK_AUDIO }}" ;;
                3d) WEBHOOK_URL="${{ env.DS_WEBHOOK_3D }}" ;;
                embeddings) WEBHOOK_URL="${{ env.DS_WEBHOOK_EMBEDDINGS }}" ;;
              esac

              if [ -f /tmp/discord_${CAT}_std.json ] && [ -n "$WEBHOOK_URL" ]; then
                curl -H "Content-Type: application/json" -d @/tmp/discord_${CAT}_std.json "$WEBHOOK_URL"
              fi
            fi
          done

          for CAT in "${CATEGORIES[@]}"; do
            if [ "$(cat /tmp/changed_${CAT}.flag 2>/dev/null)" = "true" ]; then
              if [ -f /tmp/discord_${CAT}_comm.json ] && [ -n "${{ env.DS_WEBHOOK_COMMUNITY }}" ]; then
                curl -H "Content-Type: application/json" -d @/tmp/discord_${CAT}_comm.json "${{ env.DS_WEBHOOK_COMMUNITY }}"
              fi
            fi
          done

      - name: Commit and Push
        run: |
          if git diff --quiet text_models.json image_models.json video_models.json audio_models.json 3d_models.json embeddings_models.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add text_models.json image_models.json video_models.json audio_models.json 3d_models.json embeddings_models.json
          git commit -m "Update Pollinations models [$(date +'%Y-%m-%d %H:%M')]"
          git push origin saves
