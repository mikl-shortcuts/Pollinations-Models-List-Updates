name: Pollinations Models Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TG_CHAT: ${{ secrets.TELEGRAM_TO }}
  DS_LEGACY: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DS_POLLENS: ${{ secrets.DS_WB }}

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout saves branch
        uses: actions/checkout@v4
        with:
          ref: saves
          sparse-checkout: |
            pollinations_text_models.json
            pollinations_image_models.json
            pollens_text_models.json
            pollens_image_models.json
          sparse-checkout-cone-mode: false
        continue-on-error: true

      - name: Check Legacy Text Models
        run: |
          set +e
          for i in {1..3}; do
            curl -sS --fail -A "github-actions-bot" "https://text.pollinations.ai/models" -o /tmp/text_models.json && break
            sleep 5
          done
          
          if [ ! -f /tmp/text_models.json ]; then
             curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
               -d chat_id="${{ env.TG_CHAT }}" \
               -d text="‼️<i>Maybe</i> <b>Pollinations AI Text API is down</b>‼️" \
               -d parse_mode="HTML"
             exit 0
          fi
          set -e

          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          def to_monospace(s):
              mono_map = {'a': '𝚊', 'b': '𝚋', 'c': '𝚌', 'd': '𝚍', 'e': '𝚎', 'f': '𝚏', 'g': '𝚐', 'h': '𝚑', 'i': '𝚒', 'j': '𝚓', 'k': '𝚔', 'l': '𝚕', 'm': '𝚖', 'n': '𝚗', 'o': '𝚘', 'p': '𝚙', 'q': '𝚚', 'r': '𝚛', 's': '𝚜', 't': '𝚝', 'u': '𝚞', 'v': '𝚟', 'w': '𝚠', 'x': '𝚡', 'y': '𝚢', 'z': '𝚣', 'A': '𝙰', 'B': '𝙱', 'C': '𝙲', 'D': '𝙳', 'E': '𝙴', 'F': '𝙵', 'G': '𝙶', 'H': '𝙷', 'I': '𝙸', 'J': '𝙹', 'K': '𝙺', 'L': '𝙻', 'M': '𝙼', 'N': '𝙽', 'O': '𝙾', 'P': '𝙿', 'Q': '𝚀', 'R': '𝚁', 'S': '𝚂', 'T': '𝚃', 'U': '𝚄', 'V': '𝚅', 'W': '𝚆', 'X': '𝚇', 'Y': '𝚈', 'Z': '𝚉', '0': '𝟶', '1': '𝟷', '2': '𝟸', '3': '𝟹', '4': '𝟺', '5': '𝟻', '6': '𝟼', '7': '𝟽', '8': '𝟾', '9': '𝟿'}
              return "".join(mono_map.get(c, c) for c in s)

          def normalize_model(m):
              m = dict(m)
              for key in ("input_modalities", "output_modalities", "voices", "tools"):
                  if key in m and isinstance(m[key], list):
                      m[key] = sorted(set(m[key]))
              return m

          tmp = Path("/tmp/text_models.json")
          try:
              data = json.loads(tmp.read_text(encoding="utf-8"))
          except Exception:
              sys.exit(0)

          normalized = [normalize_model(m) for m in data]
          normalized.sort(key=lambda x: str(x.get("name","")))
          curr_txt = json.dumps(normalized, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          prev_path = Path("pollinations_text_models.json")
          
          if not prev_path.exists():
              prev_path.write_text(curr_txt, encoding="utf-8")
              Path("/tmp/changed_lt.flag").write_text("false", encoding="utf-8")
              sys.exit(0)

          prev = json.loads(prev_path.read_text(encoding="utf-8"))
          prev_map = {str(i.get("name","")): i for i in prev if i.get("name")}
          curr_map = {str(i.get("name","")): i for i in normalized if i.get("name")}

          added = sorted(set(curr_map) - set(prev_map))
          removed = sorted(set(prev_map) - set(curr_map))
          common = sorted(set(prev_map) & set(curr_map))
          modified = {}

          def diff_dicts(o,n):
              d={}
              for k in sorted(set(o)|set(n)):
                  ov=o.get(k); nv=n.get(k)
                  if ov!=nv:
                      if isinstance(ov, list) and isinstance(nv, list):
                          if set(ov) != set(nv): d[k] = {"old":ov, "new":nv}
                      else:
                          d[k] = {"old":ov, "new":nv}
              return d

          for name in common:
              d = diff_dicts(prev_map[name], curr_map[name])
              if d: modified[name]=d

          has_changes = bool(added or removed or modified)
          Path("/tmp/changed_lt.flag").write_text("true" if has_changes else "false", encoding="utf-8")

          if has_changes:
              prev_path.write_text(curr_txt, encoding="utf-8")
              
              lines = []
              if added:
                  lines.append("\n<b>+ Added models:</b>")
                  for n in added: lines.append(f"  - <code>{n}</code> ({curr_map[n].get('description','?')})")
              if removed:
                  lines.append("\n<b>- Deleted models:</b>")
                  for n in removed: lines.append(f"  - <code>{n}</code> ({prev_map[n].get('description','?')})")
              if modified:
                  lines.append("\n<b>&gt; Updated models:</b>")
                  for n in sorted(modified):
                      lines.append(f"  - <code>{n}</code>:")
                      for k,ch in modified[n].items(): lines.append(f"      • {k}: {ch['old']} → {ch['new']}")
              
              full_msg = "<b>📜 Pollinations AI (Legacy) Text Models Update:</b>\n" + "\n".join(lines)
              Path("/tmp/msg_lt.txt").write_text(full_msg, encoding="utf-8")

              embeds = []
              if added:
                  desc = []
                  for n in added:
                      desc.append(f"- {to_monospace(n)} {curr_map[n].get('description','')}")
                  embeds.append({"title": "Added Models:", "description": "\n".join(desc), "color": 0x86B953})
              
              if modified:
                  desc = []
                  for n in sorted(modified):
                      desc.append(f"- {to_monospace(n)}:")
                      for k,ch in modified[n].items(): desc.append(f"   - {k}: {ch['old']} -> {ch['new']}")
                  embeds.append({"title": "Updated Models:", "description": "\n".join(desc), "color": 0xF5C944})

              if removed:
                  desc = []
                  for n in removed:
                      desc.append(f"- {to_monospace(n)} {prev_map[n].get('description','')}")
                  embeds.append({"title": "Deleted Models:", "description": "\n".join(desc), "color": 0xEB512E})

              discord_payload = {
                  "content": "## 📜 Pollinations AI (Legacy) Text Models Update:",
                  "username": "Pollinations Models List Updates Bot",
                  "avatar_url": "https://raw.githubusercontent.com/MIKL08/pollinations-updates-notifications/refs/heads/master/Photoroom_20250827_191533.jpeg",
                  "embeds": embeds
              }
              Path("/tmp/discord_lt.json").write_text(json.dumps(discord_payload), encoding="utf-8")
          PY

      - name: Check Legacy Image Models
        run: |
          set +e
          for i in {1..3}; do
            curl -sS --fail -A "github-actions-bot" "https://image.pollinations.ai/models" -o /tmp/image_models.json && break
            sleep 5
          done
          if [ ! -f /tmp/image_models.json ]; then
             curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
               -d chat_id="${{ env.TG_CHAT }}" \
               -d text="‼️<i>Maybe</i> <b>Pollinations Image Source is down</b>‼️" -d parse_mode="HTML"
             exit 0
          fi
          set -e

          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          def to_monospace(s):
              mono_map = {'a': '𝚊', 'b': '𝚋', 'c': '𝚌', 'd': '𝚍', 'e': '𝚎', 'f': '𝚏', 'g': '𝚐', 'h': '𝚑', 'i': '𝚒', 'j': '𝚓', 'k': '𝚔', 'l': '𝚕', 'm': '𝚖', 'n': '𝚗', 'o': '𝚘', 'p': '𝚙', 'q': '𝚚', 'r': '𝚛', 's': '𝚜', 't': '𝚝', 'u': '𝚞', 'v': '𝚟', 'w': '𝚠', 'x': '𝚡', 'y': '𝚢', 'z': '𝚣', '0': '𝟶', '1': '𝟷', '2': '𝟸', '3': '𝟹', '4': '𝟺', '5': '𝟻', '6': '𝟼', '7': '𝟽', '8': '𝟾', '9': '𝟿'}
              return "".join(mono_map.get(c, c) for c in s)

          tmp = Path("/tmp/image_models.json")
          try:
              curr_list = json.loads(tmp.read_text(encoding="utf-8"))
              curr_set = set(str(x) for x in curr_list if x)
          except: sys.exit(0)

          prev_path = Path("pollinations_image_models.json")
          if not prev_path.exists():
              prev_path.write_text(json.dumps(sorted(curr_set), indent=2) + "\n", encoding="utf-8")
              Path("/tmp/changed_li.flag").write_text("false", encoding="utf-8")
              sys.exit(0)

          prev_set = set(str(x) for x in json.loads(prev_path.read_text(encoding="utf-8")) if x)
          added = sorted(curr_set - prev_set)
          removed = sorted(prev_set - curr_set)
          has_changes = bool(added or removed)
          
          Path("/tmp/changed_li.flag").write_text("true" if has_changes else "false", encoding="utf-8")

          if has_changes:
              prev_path.write_text(json.dumps(sorted(curr_set), indent=2) + "\n", encoding="utf-8")
              
              lines = []
              if added:
                  lines.append("\n<b>+ Added models:</b>")
                  for n in added: lines.append(f"  - <code>{n}</code>")
              if removed:
                  lines.append("\n<b>- Deleted models:</b>")
                  for n in removed: lines.append(f"  - <code>{n}</code>")
              full_msg = "<b>📠 Pollinations AI (Legacy) Image Models Update:</b>\n" + "\n".join(lines)
              Path("/tmp/msg_li.txt").write_text(full_msg, encoding="utf-8")

              embeds = []
              if added:
                  desc = [f"- {to_monospace(n)}" for n in added]
                  embeds.append({"title": "Added Models:", "description": "\n".join(desc), "color": 0x86B953})
              if removed:
                  desc = [f"- {to_monospace(n)}" for n in removed]
                  embeds.append({"title": "Deleted Models:", "description": "\n".join(desc), "color": 0xEB512E})
              
              discord_payload = {
                  "content": "## 📠 Pollinations AI (Legacy) Image Models Update:",
                  "username": "Pollinations Models List Updates Bot",
                  "avatar_url": "https://raw.githubusercontent.com/MIKL08/pollinations-updates-notifications/refs/heads/master/Photoroom_20250827_191533.jpeg",
                  "embeds": embeds
              }
              Path("/tmp/discord_li.json").write_text(json.dumps(discord_payload), encoding="utf-8")
          PY

      - name: Check Pollens Text Models
        run: |
          set +e
          for i in {1..3}; do
            curl -sS --fail -A "github-actions-bot" "https://gen.pollinations.ai/api/generate/text/models" -o /tmp/p_text.json && break
            sleep 5
          done
          if [ ! -f /tmp/p_text.json ]; then
             curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
               -d chat_id="${{ env.TG_CHAT }}" \
               -d text="‼️<i>Maybe</i> <b>Pollens Text API is down</b>‼️" -d parse_mode="HTML"
             exit 0
          fi
          set -e

          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          def to_monospace(s):
              mono_map = {'a': '𝚊', 'b': '𝚋', 'c': '𝚌', 'd': '𝚍', 'e': '𝚎', 'f': '𝚏', 'g': '𝚐', 'h': '𝚑', 'i': '𝚒', 'j': '𝚓', 'k': '𝚔', 'l': '𝚕', 'm': '𝚖', 'n': '𝚗', 'o': '𝚘', 'p': '𝚙', 'q': '𝚚', 'r': '𝚛', 's': '𝚜', 't': '𝚝', 'u': '𝚞', 'v': '𝚟', 'w': '𝚠', 'x': '𝚡', 'y': '𝚢', 'z': '𝚣', '0': '𝟶', '1': '𝟷', '2': '𝟸', '3': '𝟹', '4': '𝟺', '5': '𝟻', '6': '𝟼', '7': '𝟽', '8': '𝟾', '9': '𝟿'}
              return "".join(mono_map.get(c, c) for c in s)

          MAX_LEN = 3500
          tmp = Path("/tmp/p_text.json")
          try:
              data = json.loads(tmp.read_text(encoding="utf-8"))
          except: sys.exit(0)
          
          models = data.get("data", []) if isinstance(data, dict) else data
          normalized = [dict(m) for m in models]
          normalized.sort(key=lambda x: str(x.get("name","")))
          curr_txt = json.dumps(normalized, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          prev_path = Path("pollens_text_models.json")

          if not prev_path.exists():
              prev_path.write_text(curr_txt, encoding="utf-8")
              Path("/tmp/changed_pt.flag").write_text("false", encoding="utf-8")
              sys.exit(0)

          prev = json.loads(prev_path.read_text(encoding="utf-8"))
          prev_map = {str(i.get("name","")): i for i in prev if i.get("name")}
          curr_map = {str(i.get("name","")): i for i in normalized if i.get("name")}

          added = sorted(set(curr_map) - set(prev_map))
          removed = sorted(set(prev_map) - set(curr_map))
          common = sorted(set(prev_map) & set(curr_map))
          modified = {}

          def diff_dicts(o, n, prefix=""):
              d = {}
              for k in sorted(set(o.keys()) | set(n.keys())):
                  if k == "created": continue
                  full_key = f"{prefix}.{k}" if prefix else k
                  ov, nv = o.get(k), n.get(k)
                  if ov != nv:
                      if isinstance(ov, dict) and isinstance(nv, dict):
                          d.update(diff_dicts(ov, nv, full_key))
                      else:
                          d[full_key] = {"old": ov, "new": nv}
              return d
          for name in common:
              d = diff_dicts(prev_map[name], curr_map[name])
              if d: modified[name] = d

          has_changes = bool(added or removed or modified)
          Path("/tmp/changed_pt.flag").write_text("true" if has_changes else "false", encoding="utf-8")

          if has_changes:
              prev_path.write_text(curr_txt, encoding="utf-8")
              
              blocks = []
              for n in added: blocks.append(("added", f"  - <code>{n}</code> ({curr_map[n].get('description','?')})"))
              for n in removed: blocks.append(("removed", f"  - <code>{n}</code> ({prev_map[n].get('description','?')})"))
              for n in sorted(modified):
                  mlines = [f"  - <code>{n}</code> ({curr_map[n].get('description','?')}):"]
                  for k, ch in sorted(modified[n].items()): mlines.append(f"      • {k}: {ch['old']} → {ch['new']}")
                  blocks.append(("modified", "\n".join(mlines)))

              header = "<b>💬 Pollinations AI Text Models Update:</b>"
              sec_h = {"added": "\n<b>+ Added models:</b>", "removed": "\n<b>- Deleted models:</b>", "modified": "\n<b>&gt; Updated models:</b>"}
              parts = []
              cur_lines = []
              cur_sec = None
              cur_len = 0
              for sec, blk in blocks:
                  to_add = ([sec_h[sec]] if sec != cur_sec else []) + [blk]
                  add_len = len("\n".join(to_add)) + 1
                  if cur_len + add_len > MAX_LEN and cur_lines:
                      parts.append("\n".join(cur_lines))
                      cur_lines = [sec_h[sec], blk]; cur_len = len("\n".join(cur_lines)) + 1; cur_sec = sec
                  else:
                      cur_lines.extend(to_add); cur_len += add_len; cur_sec = sec
              if cur_lines: parts.append("\n".join(cur_lines))
              
              for i, p in enumerate(parts):
                  Path(f"/tmp/msg_pt_{i}.txt").write_text(f"{header}\n{p}", encoding="utf-8")
              Path("/tmp/pt_count.txt").write_text(str(len(parts)), encoding="utf-8")

              embeds = []
              if added:
                  desc = [f"- {to_monospace(n)} {curr_map[n].get('description','')}" for n in added]
                  embeds.append({"title": "Added Models:", "description": "\n".join(desc), "color": 0x86B953})
              if modified:
                  desc = []
                  for n in sorted(modified):
                      desc.append(f"- {to_monospace(n)}:")
                      for k,ch in modified[n].items(): desc.append(f"   - {k}: {ch['old']} -> {ch['new']}")
                  embeds.append({"title": "Updated Models:", "description": "\n".join(desc), "color": 0xF5C944})
              if removed:
                  desc = [f"- {to_monospace(n)} {prev_map[n].get('description','')}" for n in removed]
                  embeds.append({"title": "Deleted Models:", "description": "\n".join(desc), "color": 0xEB512E})

              discord_payload = {
                  "content": "## 💬 Pollinations AI Text Models Update:",
                  "username": "Pollinations Models List Updates Bot",
                  "avatar_url": "https://raw.githubusercontent.com/MIKL08/pollinations-updates-notifications/refs/heads/master/Photoroom_20250827_191533.jpeg",
                  "embeds": embeds
              }
              Path("/tmp/discord_pt.json").write_text(json.dumps(discord_payload), encoding="utf-8")
          PY

      - name: Check Pollens Image Models
        run: |
          set +e
          for i in {1..3}; do
            curl -sS --fail -A "github-actions-bot" "https://gen.pollinations.ai/api/generate/image/models" -o /tmp/p_image.json && break
            sleep 5
          done
          if [ ! -f /tmp/p_image.json ]; then
             curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
               -d chat_id="${{ env.TG_CHAT }}" \
