name: Pollinations Models Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TG_NOTIFY: ${{ secrets.TELEGRAM_CHANNEL }}
  TG_ERROR: ${{ secrets.TELEGRAM_ERRORS }}
  DS_WEBHOOK: ${{ secrets.DS_WEBHOOK }}

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout saves branch
        uses: actions/checkout@v4
        with:
          ref: saves
          sparse-checkout: |
            text_models.json
            image_models.json
          sparse-checkout-cone-mode: false
        continue-on-error: true

      - name: Check Text Models
        run: |
          set +e
          for i in {1..3}; do
            curl -sS --fail -A "github-actions-bot" "https://gen.pollinations.ai/api/generate/text/models" -o /tmp/text_models.json && break
            sleep 5
          done
          
          if [ ! -f /tmp/text_models.json ]; then
             curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
               -d chat_id="${{ env.TG_ERROR }}" \
               -d text="‼️<i>Maybe</i> <b>Pollinations AI Text API is down</b>‼️" \
               -d parse_mode="HTML"
             exit 0
          fi
          set -e

          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          def to_monospace(s):
              mono_map = {'a': '𝚊', 'b': '𝚋', 'c': '𝚌', 'd': '𝚍', 'e': '𝚎', 'f': '𝚏', 'g': '𝚐', 'h': '𝚑', 'i': '𝚒', 'j': '𝚓', 'k': '𝚔', 'l': '𝚕', 'm': '𝚖', 'n': '𝚗', 'o': '𝚘', 'p': '𝚙', 'q': '𝚚', 'r': '𝚛', 's': '𝚜', 't': '𝚝', 'u': '𝚞', 'v': '𝚟', 'w': '𝚠', 'x': '𝚡', 'y': '𝚢', 'z': '𝚣', '0': '𝟶', '1': '𝟷', '2': '𝟸', '3': '𝟹', '4': '𝟺', '5': '𝟻', '6': '𝟼', '7': '𝟽', '8': '𝟾', '9': '𝟿'}
              return "".join(mono_map.get(c, c) for c in s)

          MAX_LEN = 3500
          tmp = Path("/tmp/text_models.json")
          try:
              data = json.loads(tmp.read_text(encoding="utf-8"))
          except: sys.exit(0)
          
          models = data.get("data", []) if isinstance(data, dict) else data
          normalized = [dict(m) for m in models]
          normalized.sort(key=lambda x: str(x.get("name","")))
          curr_txt = json.dumps(normalized, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          prev_path = Path("text_models.json")

          if not prev_path.exists():
              prev_path.write_text(curr_txt, encoding="utf-8")
              Path("/tmp/changed_text.flag").write_text("false", encoding="utf-8")
              sys.exit(0)

          prev = json.loads(prev_path.read_text(encoding="utf-8"))
          prev_map = {str(i.get("name","")): i for i in prev if i.get("name")}
          curr_map = {str(i.get("name","")): i for i in normalized if i.get("name")}

          added = sorted(set(curr_map) - set(prev_map))
          removed = sorted(set(prev_map) - set(curr_map))
          common = sorted(set(prev_map) & set(curr_map))
          modified = {}

          def diff_dicts(o, n, prefix=""):
              d = {}
              for k in sorted(set(o.keys()) | set(n.keys())):
                  if k == "created": continue
                  full_key = f"{prefix}.{k}" if prefix else k
                  ov, nv = o.get(k), n.get(k)
                  if ov != nv:
                      if isinstance(ov, dict) and isinstance(nv, dict):
                          d.update(diff_dicts(ov, nv, full_key))
                      else:
                          d[full_key] = {"old": ov, "new": nv}
              return d
          for name in common:
              d = diff_dicts(prev_map[name], curr_map[name])
              if d: modified[name] = d

          has_changes = bool(added or removed or modified)
          Path("/tmp/changed_text.flag").write_text("true" if has_changes else "false", encoding="utf-8")

          if has_changes:
              prev_path.write_text(curr_txt, encoding="utf-8")
              
              blocks = []
              for n in added: blocks.append(("added", f"  - <code>{n}</code> ({curr_map[n].get('description','?')})"))
              for n in removed: blocks.append(("removed", f"  - <code>{n}</code> ({prev_map[n].get('description','?')})"))
              for n in sorted(modified):
                  mlines = [f"  - <code>{n}</code> ({curr_map[n].get('description','?')}):"]
                  for k, ch in sorted(modified[n].items()): mlines.append(f"      • {k}: {ch['old']} → {ch['new']}")
                  blocks.append(("modified", "\n".join(mlines)))

              header = "<b>💬 Pollinations AI Text Models Update:</b>"
              sec_h = {"added": "\n<b>+ Added models:</b>", "removed": "\n<b>- Deleted models:</b>", "modified": "\n<b>&gt; Updated models:</b>"}
              parts = []
              cur_lines = []
              cur_sec = None
              cur_len = 0
              for sec, blk in blocks:
                  to_add = ([sec_h[sec]] if sec != cur_sec else []) + [blk]
                  add_len = len("\n".join(to_add)) + 1
                  if cur_len + add_len > MAX_LEN and cur_lines:
                      parts.append("\n".join(cur_lines))
                      cur_lines = [sec_h[sec], blk]; cur_len = len("\n".join(cur_lines)) + 1; cur_sec = sec
                  else:
                      cur_lines.extend(to_add); cur_len += add_len; cur_sec = sec
              if cur_lines: parts.append("\n".join(cur_lines))
              
              for i, p in enumerate(parts):
                  Path(f"/tmp/msg_text_{i}.txt").write_text(f"{header}\n{p}", encoding="utf-8")
              Path("/tmp/text_count.txt").write_text(str(len(parts)), encoding="utf-8")

              embeds = []
              if added:
                  desc = [f"- {to_monospace(n)} {curr_map[n].get('description','')}" for n in added]
                  embeds.append({"title": "Added Models:", "description": "\n".join(desc), "color": 0x86B953})
              if modified:
                  desc = []
                  for n in sorted(modified):
                      desc.append(f"- {to_monospace(n)}:")
                      for k,ch in modified[n].items(): desc.append(f"   - {k}: {ch['old']} -> {ch['new']}")
                  embeds.append({"title": "Updated Models:", "description": "\n".join(desc), "color": 0xF5C944})
              if removed:
                  desc = [f"- {to_monospace(n)} {prev_map[n].get('description','')}" for n in removed]
                  embeds.append({"title": "Deleted Models:", "description": "\n".join(desc), "color": 0xEB512E})

              discord_payload = {
                  "content": "## 💬 Pollinations AI Text Models Update:",
                  "username": "Pollinations Models List Updates Bot",
                  "avatar_url": "https://raw.githubusercontent.com/MIKL08/pollinations-updates-notifications/refs/heads/master/Photoroom_20250827_191533.jpeg",
                  "embeds": embeds
              }
              Path("/tmp/discord_text.json").write_text(json.dumps(discord_payload), encoding="utf-8")
          PY

      - name: Check Image Models
        run: |
          set +e
          for i in {1..3}; do
            curl -sS --fail -A "github-actions-bot" "https://gen.pollinations.ai/api/generate/image/models" -o /tmp/image_models.json && break
            sleep 5
          done
          if [ ! -f /tmp/image_models.json ]; then
             curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
               -d chat_id="${{ env.TG_ERROR }}" \
               -d text="‼️<i>Maybe</i> <b>Pollinations AI Image API is down</b>‼️" -d parse_mode="HTML"
             exit 0
          fi
          set -e

          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          def to_monospace(s):
              mono_map = {'a': '𝚊', 'b': '𝚋', 'c': '𝚌', 'd': '𝚍', 'e': '𝚎', 'f': '𝚏', 'g': '𝚐', 'h': '𝚑', 'i': '𝚒', 'j': '𝚓', 'k': '𝚔', 'l': '𝚕', 'm': '𝚖', 'n': '𝚗', 'o': '𝚘', 'p': '𝚙', 'q': '𝚚', 'r': '𝚛', 's': '𝚜', 't': '𝚝', 'u': '𝚞', 'v': '𝚟', 'w': '𝚠', 'x': '𝚡', 'y': '𝚢', 'z': '𝚣', '0': '𝟶', '1': '𝟷', '2': '𝟸', '3': '𝟹', '4': '𝟺', '5': '𝟻', '6': '𝟼', '7': '𝟽', '8': '𝟾', '9': '𝟿'}
              return "".join(mono_map.get(c, c) for c in s)

          MAX_LEN = 3500
          tmp = Path("/tmp/image_models.json")
          try:
              data = json.loads(tmp.read_text(encoding="utf-8"))
          except: sys.exit(0)
          
          models = data.get("data", []) if isinstance(data, dict) else data
          normalized = [dict(m) for m in models]
          normalized.sort(key=lambda x: str(x.get("name","")))
          curr_txt = json.dumps(normalized, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          prev_path = Path("image_models.json")

          if not prev_path.exists():
              prev_path.write_text(curr_txt, encoding="utf-8")
              Path("/tmp/changed_image.flag").write_text("false", encoding="utf-8")
              sys.exit(0)

          prev = json.loads(prev_path.read_text(encoding="utf-8"))
          prev_map = {str(i.get("name","")): i for i in prev if i.get("name")}
          curr_map = {str(i.get("name","")): i for i in normalized if i.get("name")}

          added = sorted(set(curr_map) - set(prev_map))
          removed = sorted(set(prev_map) - set(curr_map))
          common = sorted(set(prev_map) & set(curr_map))
          modified = {}

          def diff_dicts(o, n, prefix=""):
              d = {}
              for k in sorted(set(o.keys()) | set(n.keys())):
                  if k == "created": continue
                  full_key = f"{prefix}.{k}" if prefix else k
                  ov, nv = o.get(k), n.get(k)
                  if ov != nv:
                      if isinstance(ov, dict) and isinstance(nv, dict):
                          d.update(diff_dicts(ov, nv, full_key))
                      else:
                          d[full_key] = {"old": ov, "new": nv}
              return d
          for name in common:
              d = diff_dicts(prev_map[name], curr_map[name])
              if d: modified[name] = d

          has_changes = bool(added or removed or modified)
          Path("/tmp/changed_image.flag").write_text("true" if has_changes else "false", encoding="utf-8")

          if has_changes:
              prev_path.write_text(curr_txt, encoding="utf-8")
              
              blocks = []
              for n in added: blocks.append(("added", f"  - <code>{n}</code> ({curr_map[n].get('description','?')})"))
              for n in removed: blocks.append(("removed", f"  - <code>{n}</code> ({prev_map[n].get('description','?')})"))
              for n in sorted(modified):
                  mlines = [f"  - <code>{n}</code> ({curr_map[n].get('description','?')}):"]
                  for k, ch in sorted(modified[n].items()): mlines.append(f"      • {k}: {ch['old']} → {ch['new']}")
                  blocks.append(("modified", "\n".join(mlines)))

              header = "<b>🖼️ Pollinations AI Image Models Update:</b>"
              sec_h = {"added": "\n<b>+ Added models:</b>", "removed": "\n<b>- Deleted models:</b>", "modified": "\n<b>&gt; Updated models:</b>"}
              parts = []
              cur_lines = []
              cur_sec = None
              cur_len = 0
              for sec, blk in blocks:
                  to_add = ([sec_h[sec]] if sec != cur_sec else []) + [blk]
                  add_len = len("\n".join(to_add)) + 1
                  if cur_len + add_len > MAX_LEN and cur_lines:
                      parts.append("\n".join(cur_lines))
                      cur_lines = [sec_h[sec], blk]; cur_len = len("\n".join(cur_lines)) + 1; cur_sec = sec
                  else:
                      cur_lines.extend(to_add); cur_len += add_len; cur_sec = sec
              if cur_lines: parts.append("\n".join(cur_lines))
              
              for i, p in enumerate(parts):
                  Path(f"/tmp/msg_image_{i}.txt").write_text(f"{header}\n{p}", encoding="utf-8")
              Path("/tmp/image_count.txt").write_text(str(len(parts)), encoding="utf-8")

              embeds = []
              if added:
                  desc = [f"- {to_monospace(n)} {curr_map[n].get('description','')}" for n in added]
                  embeds.append({"title": "Added Models:", "description": "\n".join(desc), "color": 0x86B953})
              if modified:
                  desc = []
                  for n in sorted(modified):
                      desc.append(f"- {to_monospace(n)}:")
                      for k,ch in modified[n].items(): desc.append(f"   - {k}: {ch['old']} -> {ch['new']}")
                  embeds.append({"title": "Updated Models:", "description": "\n".join(desc), "color": 0xF5C944})
              if removed:
                  desc = [f"- {to_monospace(n)} {prev_map[n].get('description','')}" for n in removed]
                  embeds.append({"title": "Deleted Models:", "description": "\n".join(desc), "color": 0xEB512E})

              discord_payload = {
                  "content": "## 🖼️ Pollinations AI Image Models Update:",
                  "username": "Pollinations Models List Updates Bot",
                  "avatar_url": "https://raw.githubusercontent.com/MIKL08/pollinations-updates-notifications/refs/heads/master/Photoroom_20250827_191533.jpeg",
                  "embeds": embeds
              }
              Path("/tmp/discord_image.json").write_text(json.dumps(discord_payload), encoding="utf-8")
          PY

      - name: Send Notifications
        run: |
          if [ "$(cat /tmp/changed_text.flag 2>/dev/null)" = "true" ]; then
             PARTS=$(cat /tmp/text_count.txt)
             for i in $(seq 0 $((PARTS - 1))); do
               MSG=$(cat /tmp/msg_text_${i}.txt)
               curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
                 -H "Content-Type: application/json" \
                 -d "$(jq -n --arg chat "${{ env.TG_NOTIFY }}" --arg text "$MSG" '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
               sleep 1
             done
             curl -H "Content-Type: application/json" -d @/tmp/discord_text.json "${{ env.DS_WEBHOOK }}"
          fi

          if [ "$(cat /tmp/changed_image.flag 2>/dev/null)" = "true" ]; then
             PARTS=$(cat /tmp/image_count.txt)
             for i in $(seq 0 $((PARTS - 1))); do
               MSG=$(cat /tmp/msg_image_${i}.txt)
               curl -s -X POST "https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage" \
                 -H "Content-Type: application/json" \
                 -d "$(jq -n --arg chat "${{ env.TG_NOTIFY }}" --arg text "$MSG" '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
               sleep 1
             done
             curl -H "Content-Type: application/json" -d @/tmp/discord_image.json "${{ env.DS_WEBHOOK }}"
          fi

      - name: Commit and Push
        run: |
          if git diff --quiet text_models.json image_models.json; then
             exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add text_models.json image_models.json
          git commit -m "Update Pollinations models [$(date +'%Y-%m-%d %H:%M')]"
          git push origin saves